# Extra living-room lights. Demo already provides ceiling_lights + living_room_rgbww_lights.
light:
  - platform: virtual
    name: "!Stue gulvlampe"
    initial_value: "off"
    support_brightness: true
    initial_brightness: 180
    support_color_temp: true
    initial_color_temp: 200
    persistent: false
  - platform: virtual
    name: "!Stue vindu"
    initial_value: "off"
    support_brightness: true
    initial_brightness: 90
    support_color_temp: true
    initial_color_temp: 200
    persistent: false
