# Native HA scenes, one set per area. Area assignment is in area_map.yaml.

# --- Stue ---
- id: stue_dag
  name: Stue dag
  icon: mdi:white-balance-sunny
  entities:
    light.ceiling_lights:
      state: on
      brightness: 255
      color_temp_kelvin: 4500
    light.living_room_rgbww_lights:
      state: on
      brightness: 240
      rgbww_color: [255, 240, 220, 255, 180]
    light.stue_gulvlampe:
      state: off
    light.stue_spotter:
      state: on
      brightness: 200
      hs_color: [40, 20]

- id: stue_kveld
  name: Stue kveld
  icon: mdi:weather-sunset
  entities:
    light.ceiling_lights:
      state: on
      brightness: 120
      color_temp_kelvin: 2700
    light.living_room_rgbww_lights:
      state: on
      brightness: 90
      rgbww_color: [255, 120, 40, 80, 255]
    light.stue_gulvlampe:
      state: on
      brightness: 160
      color_temp_kelvin: 2200
    light.stue_spotter:
      state: on
      brightness: 80
      hs_color: [30, 70]

- id: stue_natt
  name: Stue natt
  icon: mdi:weather-night
  entities:
    light.ceiling_lights:
      state: off
    light.living_room_rgbww_lights:
      state: off
    light.stue_gulvlampe:
      state: on
      brightness: 40
      color_temp_kelvin: 2000
    light.stue_spotter:
      state: off

# --- Kjøkken ---
- id: kjokken_dag
  name: Kjøkken dag
  icon: mdi:white-balance-sunny
  entities:
    light.kitchen_lights:
      state: on
      brightness: 255
      hs_color: [40, 25]
    light.office_rgbw_lights:
      state: on
      brightness: 220
      rgbw_color: [255, 240, 210, 255]
    light.kjokken_benkelys:
      state: on
      brightness: 200
      color_temp_kelvin: 4000
    light.kjokken_overoy:
      state: on
      brightness: 180
      hs_color: [45, 15]

- id: kjokken_kveld
  name: Kjøkken kveld
  icon: mdi:weather-sunset
  entities:
    light.kitchen_lights:
      state: on
      brightness: 100
      hs_color: [30, 60]
    light.office_rgbw_lights:
      state: on
      brightness: 80
      rgbw_color: [255, 140, 40, 80]
    light.kjokken_benkelys:
      state: on
      brightness: 90
      color_temp_kelvin: 2700
    light.kjokken_overoy:
      state: off

- id: kjokken_natt
  name: Kjøkken natt
  icon: mdi:weather-night
  entities:
    light.kitchen_lights:
      state: off
    light.office_rgbw_lights:
      state: off
    light.kjokken_benkelys:
      state: on
      brightness: 30
      color_temp_kelvin: 2200
    light.kjokken_overoy:
      state: off

# --- Soverom ---
- id: soverom_dag
  name: Soverom dag
  icon: mdi:white-balance-sunny
  entities:
    light.bed_light:
      state: off
    light.entrance_color_white_lights:
      state: on
      brightness: 220
      hs_color: [40, 20]
    light.soverom_tak:
      state: on
      brightness: 220
      color_temp_kelvin: 4200
    light.soverom_garderobe:
      state: on
      brightness: 180

- id: soverom_kveld
  name: Soverom kveld
  icon: mdi:weather-sunset
  entities:
    light.bed_light:
      state: on
      brightness: 80
      effect: rainbow
    light.entrance_color_white_lights:
      state: on
      brightness: 90
      hs_color: [30, 65]
    light.soverom_tak:
      state: on
      brightness: 80
      color_temp_kelvin: 2500
    light.soverom_garderobe:
      state: off

- id: soverom_natt
  name: Soverom natt
  icon: mdi:weather-night
  entities:
    light.bed_light:
      state: on
      brightness: 20
      effect: none
    light.entrance_color_white_lights:
      state: off
    light.soverom_tak:
      state: off
    light.soverom_garderobe:
      state: off
