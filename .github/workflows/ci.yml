name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Current Home Assistant Requires-Python is >=3.14.2; 3.11 resolves to
          # ancient PyPI wheels that lack StaticPathConfig / LockState.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint black isort pytest homeassistant

      - name: Run pylint
        run: |
          pylint custom_components/scene_extrapolation/

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/ -q

      - name: Run black
        run: |
          black --check custom_components/scene_extrapolation/ tests/

      - name: Run isort
        run: |
          isort --check-only custom_components/scene_extrapolation/ tests/

  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate manifest.json
        run: |
          # Check if manifest.json is valid JSON
          python -c "import json; json.load(open('custom_components/scene_extrapolation/manifest.json'))"

          # Check required fields
          python -c "
          import json
          manifest = json.load(open('custom_components/scene_extrapolation/manifest.json'))
          required_fields = ['domain', 'name', 'version', 'config_flow']
          for field in required_fields:
              if field not in manifest:
                  raise ValueError(f'Missing required field: {field}')
          print('Manifest validation passed')
          "

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate hacs.json
        run: |
          # Check if hacs.json is valid JSON
          python -c "import json; json.load(open('hacs.json'))"
          echo "HACS configuration validation passed"

  # Full language trees are a release-time pass (PRs to master), not required on dev.
  validate-translations:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check translation key trees
        run: python .github/scripts/check_translations.py
