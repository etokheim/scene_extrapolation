name: Release

# Merging a PR into master publishes a GitHub (and HACS) release from
# CHANGELOG Unreleased. Do not also bump version / move Unreleased in the PR.
on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = infer from CHANGELOG Unreleased)"
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      skipped: ${{ steps.plan.outputs.skipped }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Resolve bump type
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUMP: ${{ github.event.inputs.bump }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          SKIP=false
          BUMP="${DISPATCH_BUMP:-auto}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if echo "$PR_LABELS" | grep -q 'release:skip'; then
              SKIP=true
            elif echo "$PR_LABELS" | grep -q 'release:major'; then
              BUMP=major
            elif echo "$PR_LABELS" | grep -q 'release:minor'; then
              BUMP=minor
            elif echo "$PR_LABELS" | grep -q 'release:patch'; then
              BUMP=patch
            else
              BUMP=auto
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Plan release
        id: plan
        if: steps.bump.outputs.skip != 'true'
        run: python .github/scripts/cut_release.py --bump "${{ steps.bump.outputs.bump }}"

      - name: Skip
        if: steps.bump.outputs.skip == 'true' || steps.plan.outputs.skipped == 'true'
        run: |
          echo "No GitHub release for this merge."
          echo "skip=${{ steps.bump.outputs.skip }}"
          echo "plan_skipped=${{ steps.plan.outputs.skipped }}"
          echo "reason=${{ steps.plan.outputs.reason }}"

      - name: Apply version and changelog
        if: steps.bump.outputs.skip != 'true' && steps.plan.outputs.skipped == 'false'
        run: python .github/scripts/cut_release.py --bump "${{ steps.bump.outputs.bump }}" --apply

      - name: Commit release files
        if: steps.bump.outputs.skip != 'true' && steps.plan.outputs.skipped == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add custom_components/scene_extrapolation/manifest.json \
            custom_components/scene_extrapolation/panel.py \
            CHANGELOG.md
          git commit -m "Release ${{ steps.plan.outputs.version }}: update version and changelog"
          git push origin master
          git tag -a "${{ steps.plan.outputs.tag }}" -m "Scene Extrapolation ${{ steps.plan.outputs.version }}"
          git push origin "${{ steps.plan.outputs.tag }}"

      - name: Create GitHub release
        if: steps.bump.outputs.skip != 'true' && steps.plan.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.plan.outputs.tag }}" \
            --title "Scene Extrapolation ${{ steps.plan.outputs.version }}" \
            --notes-file "${{ steps.plan.outputs.notes_file }}"

      - name: Comment on the merged PR
        if: github.event_name == 'pull_request' && steps.bump.outputs.skip != 'true' && steps.plan.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<EOF
          Published **Scene Extrapolation ${{ steps.plan.outputs.version }}**.
          ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.plan.outputs.tag }}
          EOF
          )"

      - name: Sync dev with master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin master
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            git fetch origin dev
            git checkout -B dev origin/dev
            if git merge origin/master -m "Merge master back into dev after ${{ steps.plan.outputs.version || 'master' }} update"; then
              git push origin dev
            else
              echo "::warning::Could not merge master into dev (likely conflicts). Merge origin/master into dev manually."
              git merge --abort || true
            fi
          else
            git checkout -B dev origin/master
            git push -u origin dev
            echo "Created origin/dev from master"
          fi
